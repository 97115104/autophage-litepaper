<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="priceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="healthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ECC71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27AE60;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="marketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#FFFFFF"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold">
    Metabolic Price Discovery Model
  </text>
  
  <!-- Price Formula Display -->
  <g transform="translate(450, 90)">
    <rect x="-350" y="-25" width="700" height="60" fill="#F8F8F8" stroke="#CCCCCC" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" fill="#333333" font-family="Times New Roman, serif" font-size="16" font-style="italic">
      P(t) = [E<tspan baseline-shift="sub" font-size="12">health</tspan>(t)(1 + γC<tspan baseline-shift="sub" font-size="12">ratio</tspan>) + V<tspan baseline-shift="sub" font-size="12">market</tspan>(t)(1 - C<tspan baseline-shift="sub" font-size="12">ratio</tspan>)] / [S<tspan baseline-shift="sub" font-size="12">active</tspan>(t) × V × (1 + M<tspan baseline-shift="sub" font-size="12">activity</tspan>)]
    </text>
  </g>
  
  <!-- Numerator Components -->
  <g id="numerator">
    <text x="450" y="180" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">
      NUMERATOR (Value Inputs)
    </text>
    
    <!-- Health Energy Component -->
    <g transform="translate(150, 220)">
      <rect x="-80" y="-30" width="160" height="100" fill="#FFFFFF" stroke="url(#healthGradient)" stroke-width="2.5" rx="10" filter="url(#shadow)"/>
      <text x="0" y="-10" text-anchor="middle" fill="#2ECC71" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">
        Health Energy
      </text>
      <text x="0" y="10" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic">
        E<tspan baseline-shift="sub" font-size="10">health</tspan>(t)
      </text>
      <rect x="-60" y="20" width="120" height="30" fill="url(#healthGradient)" opacity="0.2" rx="5"/>
      <text x="0" y="40" text-anchor="middle" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="11">
        Verified Activities
      </text>
    </g>
    
    <!-- Market Volume Component -->
    <g transform="translate(450, 220)">
      <rect x="-80" y="-30" width="160" height="100" fill="#FFFFFF" stroke="url(#marketGradient)" stroke-width="2.5" rx="10" filter="url(#shadow)"/>
      <text x="0" y="-10" text-anchor="middle" fill="#E74C3C" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">
        Market Volume
      </text>
      <text x="0" y="10" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic">
        V<tspan baseline-shift="sub" font-size="10">market</tspan>(t)
      </text>
      <rect x="-60" y="20" width="120" height="30" fill="url(#marketGradient)" opacity="0.2" rx="5"/>
      <text x="0" y="40" text-anchor="middle" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="11">
        Trading Activity
      </text>
    </g>
    
    <!-- Catalyst Ratio Modifier -->
    <g transform="translate(750, 220)">
      <rect x="-80" y="-30" width="160" height="100" fill="#FFFFFF" stroke="#9B59B6" stroke-width="2.5" rx="10" filter="url(#shadow)"/>
      <text x="0" y="-10" text-anchor="middle" fill="#9B59B6" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">
        Catalyst Ratio
      </text>
      <text x="0" y="10" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic">
        C<tspan baseline-shift="sub" font-size="10">ratio</tspan>
      </text>
      <rect x="-60" y="20" width="120" height="30" fill="#9B59B6" opacity="0.2" rx="5"/>
      <text x="0" y="40" text-anchor="middle" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="11">
        Balance Modifier
      </text>
    </g>
  </g>
  
  <!-- Division Line -->
  <line x1="100" y1="350" x2="800" y2="350" stroke="#333333" stroke-width="3"/>
  
  <!-- Denominator Components -->
  <g id="denominator">
    <text x="450" y="400" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">
      DENOMINATOR (Supply Factors)
    </text>
    
    <!-- Active Supply -->
    <g transform="translate(200, 440)">
      <rect x="-80" y="-30" width="160" height="100" fill="#FFFFFF" stroke="#F39C12" stroke-width="2.5" rx="10" filter="url(#shadow)"/>
      <text x="0" y="-10" text-anchor="middle" fill="#F39C12" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">
        Active Supply
      </text>
      <text x="0" y="10" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic">
        S<tspan baseline-shift="sub" font-size="10">active</tspan>(t)
      </text>
      <rect x="-60" y="20" width="120" height="30" fill="#F39C12" opacity="0.2" rx="5"/>
      <text x="0" y="40" text-anchor="middle" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="11">
        Circulating Tokens
      </text>
    </g>
    
    <!-- Velocity -->
    <g transform="translate(450, 440)">
      <rect x="-80" y="-30" width="160" height="100" fill="#FFFFFF" stroke="#16A085" stroke-width="2.5" rx="10" filter="url(#shadow)"/>
      <text x="0" y="-10" text-anchor="middle" fill="#16A085" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">
        Velocity
      </text>
      <text x="0" y="10" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic">
        V
      </text>
      <rect x="-60" y="20" width="120" height="30" fill="#16A085" opacity="0.2" rx="5"/>
      <text x="0" y="40" text-anchor="middle" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="11">
        Token Turnover
      </text>
    </g>
    
    <!-- Activity Multiplier -->
    <g transform="translate(700, 440)">
      <rect x="-80" y="-30" width="160" height="100" fill="#FFFFFF" stroke="#E67E22" stroke-width="2.5" rx="10" filter="url(#shadow)"/>
      <text x="0" y="-10" text-anchor="middle" fill="#E67E22" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">
        Activity Multiplier
      </text>
      <text x="0" y="10" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic">
        M<tspan baseline-shift="sub" font-size="10">activity</tspan>
      </text>
      <rect x="-60" y="20" width="120" height="30" fill="#E67E22" opacity="0.2" rx="5"/>
      <text x="0" y="40" text-anchor="middle" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="11">
        Engagement Factor
      </text>
    </g>
  </g>
  
  <!-- Result Arrow -->
  <g transform="translate(450, 550)">
    <path d="M 0,-20 L 0,15" stroke="#3498DB" stroke-width="4" marker-end="url(#arrowPrice)"/>
    <marker id="arrowPrice" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L11,4 z" fill="#3498DB" />
    </marker>
  </g>
  
  <!-- Final Price Box -->
  <g transform="translate(450, 570)">
    <rect x="-100" y="-5" width="200" height="40" fill="url(#priceGradient)" stroke="#3498DB" stroke-width="2" rx="20" filter="url(#shadow)"/>
    <text x="0" y="10" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold">
      Token Price P(t)
    </text>
  </g>
  
  <!-- Example Calculation -->
  <g transform="translate(50, 320)">
    <rect x="-40" y="-120" width="120" height="240" fill="#F0F8FF" stroke="#3498DB" stroke-width="1.5" rx="10" filter="url(#shadow)"/>
    <text x="40" y="-100" text-anchor="middle" fill="#3498DB" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold">
      Example:
    </text>
    <text x="40" y="-80" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="10">
      E<tspan baseline-shift="sub" font-size="8">health</tspan> = $10,000
    </text>
    <text x="40" y="-60" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="10">
      V<tspan baseline-shift="sub" font-size="8">market</tspan> = $5,000
    </text>
    <text x="40" y="-40" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="10">
      S<tspan baseline-shift="sub" font-size="8">active</tspan> = 100,000
    </text>
    <text x="40" y="-20" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="10">
      V = 2.0
    </text>
    <text x="40" y="0" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="10">
      C<tspan baseline-shift="sub" font-size="8">ratio</tspan> = 0.3
    </text>
    <text x="40" y="20" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="10">
      M<tspan baseline-shift="sub" font-size="8">activity</tspan> = 1.5
    </text>
    <text x="40" y="40" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="10">
      γ = 2.0
    </text>
    <line x1="10" y1="50" x2="70" y2="50" stroke="#3498DB" stroke-width="1"/>
    <text x="40" y="70" text-anchor="middle" fill="#3498DB" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold">
      P(t) = $0.078
    </text>
  </g>
</svg>