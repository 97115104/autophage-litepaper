<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradient for graph area -->
    <linearGradient id="areaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0.1" />
    </linearGradient>
    
    <!-- Gradient for the curve -->
    <linearGradient id="curveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E74C3C;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1000" height="600" fill="#fafbfc"/>
  
  <!-- Title -->
  <text x="500" y="40" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Token Balance Decay Over Time
  </text>
  
  <!-- Subtitle with formula -->
  <text x="500" y="70" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" fill="#7f8c8d">
    V(t) = V₀ × (1 - δ)ᵗ where δ = 0.05 (5% daily decay)
  </text>
  
  <!-- Chart area background -->
  <rect x="100" y="120" width="800" height="400" fill="#ffffff" stroke="#e1e4e8" stroke-width="1" rx="5" filter="url(#shadow)"/>
  
  <!-- Grid lines -->
  <g stroke="#e1e4e8" stroke-width="0.5" opacity="0.5">
    <!-- Horizontal grid lines -->
    <line x1="100" y1="520" x2="900" y2="520"/>
    <line x1="100" y1="440" x2="900" y2="440"/>
    <line x1="100" y1="360" x2="900" y2="360"/>
    <line x1="100" y1="280" x2="900" y2="280"/>
    <line x1="100" y1="200" x2="900" y2="200"/>
    <line x1="100" y1="120" x2="900" y2="120"/>
    
    <!-- Vertical grid lines -->
    <line x1="100" y1="120" x2="100" y2="520"/>
    <line x1="200" y1="120" x2="200" y2="520"/>
    <line x1="300" y1="120" x2="300" y2="520"/>
    <line x1="400" y1="120" x2="400" y2="520"/>
    <line x1="500" y1="120" x2="500" y2="520"/>
    <line x1="600" y1="120" x2="600" y2="520"/>
    <line x1="700" y1="120" x2="700" y2="520"/>
    <line x1="800" y1="120" x2="800" y2="520"/>
    <line x1="900" y1="120" x2="900" y2="520"/>
  </g>
  
  <!-- Decay curve area fill -->
  <path d="M 100 120 L 100 520 L 900 520 L 900 477 L 857 454 L 814 433 L 771 414 L 729 396 L 686 380 L 643 364 L 600 350 L 557 336 L 514 324 L 471 312 L 429 300 L 386 290 L 343 280 L 300 270 L 257 261 L 214 252 L 171 244 L 129 236 L 100 229 Z" 
        fill="url(#areaGradient)" opacity="0.6"/>
  
  <!-- Decay curve -->
  <path d="M 100 120 Q 129 229, 171 244 T 214 252 T 257 261 T 300 270 T 343 280 T 386 290 T 429 300 T 471 312 T 514 324 T 557 336 T 600 350 T 643 364 T 686 380 T 729 396 T 771 414 T 814 433 T 857 454 T 900 477" 
        stroke="url(#curveGradient)" stroke-width="4" fill="none" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0,3000;3000,0" dur="3s" repeatCount="1"/>
  </path>
  
  <!-- Half-life marker -->
  <g transform="translate(270, 250)">
    <!-- Vertical line -->
    <line x1="0" y1="-130" x2="0" y2="270" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
    
    <!-- Marker circle -->
    <circle r="8" fill="#e74c3c" filter="url(#shadow)">
      <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Label -->
    <rect x="-80" y="-160" width="160" height="30" rx="15" fill="#e74c3c" filter="url(#shadow)"/>
    <text y="-140" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
      Half-life: 13.51 days
    </text>
  </g>
  
  <!-- Interactive hover points -->
  <g>
    <!-- Day 0 -->
    <g transform="translate(100, 120)">
      <circle r="5" fill="#FF6B35" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="mouseover" end="mouseout"/>
      </circle>
      <rect x="-40" y="-35" width="80" height="25" rx="5" fill="#2C3E50" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="0.5s" begin="mouseover" end="mouseout"/>
      </rect>
      <text y="-20" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" opacity="0">
        1000 tokens
        <animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="mouseover" end="mouseout"/>
      </text>
    </g>
    
    <!-- Day 30 -->
    <g transform="translate(486, 302)">
      <circle r="5" fill="#F7931E" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="mouseover" end="mouseout"/>
      </circle>
      <rect x="-40" y="-35" width="80" height="25" rx="5" fill="#2C3E50" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="0.5s" begin="mouseover" end="mouseout"/>
      </rect>
      <text y="-20" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" opacity="0">
        215 tokens
        <animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="mouseover" end="mouseout"/>
      </text>
    </g>
    
    <!-- Day 70 -->
    <g transform="translate(900, 477)">
      <circle r="5" fill="#E74C3C" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="mouseover" end="mouseout"/>
      </circle>
      <rect x="-40" y="-35" width="80" height="25" rx="5" fill="#2C3E50" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="0.5s" begin="mouseover" end="mouseout"/>
      </rect>
      <text y="-20" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="white" opacity="0">
        30 tokens
        <animate attributeName="opacity" values="0;1;0" dur="0.5s" begin="mouseover" end="mouseout"/>
      </text>
    </g>
  </g>
  
  <!-- Y-axis labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#586069" text-anchor="end">
    <text x="90" y="125">1000</text>
    <text x="90" y="205">800</text>
    <text x="90" y="285">600</text>
    <text x="90" y="365">400</text>
    <text x="90" y="445">200</text>
    <text x="90" y="525">0</text>
  </g>
  
  <!-- X-axis labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#586069" text-anchor="middle">
    <text x="100" y="545">0</text>
    <text x="200" y="545">10</text>
    <text x="300" y="545">20</text>
    <text x="400" y="545">30</text>
    <text x="500" y="545">40</text>
    <text x="600" y="545">50</text>
    <text x="700" y="545">60</text>
    <text x="800" y="545">70</text>
  </g>
  
  <!-- Axis labels -->
  <text x="500" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50">
    Time (days)
  </text>
  
  <text x="40" y="320" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#2C3E50" transform="rotate(-90 40 320)">
    Token Balance
  </text>
  
  <!-- Key insights box -->
  <g transform="translate(720, 160)">
    <rect width="160" height="120" rx="10" fill="#f6f8fa" stroke="#e1e4e8" stroke-width="1" filter="url(#shadow)"/>
    <text x="80" y="25" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      Key Insights
    </text>
    <text x="10" y="50" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#586069">
      • 50% loss in 13.5 days
    </text>
    <text x="10" y="70" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#586069">
      • 90% loss in 45 days
    </text>
    <text x="10" y="90" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#586069">
      • 97% loss in 70 days
    </text>
    <text x="10" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#e74c3c">
      Requires constant activity!
    </text>
  </g>
</svg>