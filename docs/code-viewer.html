<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Viewer — Autophage Protocol</title>
    <meta name="description" content="View source code files">
    
    <!-- Prevent dark mode flash -->
    <script src="js/theme-init.js"></script>
    
    <!-- Configuration and Components -->
    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    
    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
    
    <style>
        .code-container {
            margin: 2em 0;
            border: 1px solid var(--rule-color);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .code-header {
            background: var(--paper-bg);
            padding: 1em;
            border-bottom: 1px solid var(--rule-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .code-header h2 {
            margin: 0;
            font-size: 1.2em;
        }
        
        .code-actions {
            display: flex;
            gap: 1em;
        }
        
        .code-button {
            padding: 0.5em 1em;
            background: var(--paper-bg);
            border: 1px solid var(--text-color);
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.9em;
            border-radius: 4px;
            text-decoration: none;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        
        .code-button:hover {
            background: var(--text-color);
            color: var(--paper-bg);
        }
        
        /* Ensure all buttons have same appearance */
        button.code-button {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        pre {
            margin: 0 !important;
            border-radius: 0 !important;
            text-shadow: none !important;
        }
        
        pre code {
            text-shadow: none !important;
        }
        
        /* Override any Prism.js text shadows */
        .token {
            text-shadow: none !important;
        }
        
        code[class*="language-"],
        pre[class*="language-"] {
            text-shadow: none !important;
        }
        
        .error-message {
            text-align: center;
            padding: 4em 2em;
            color: #e74c3c;
        }
        
        .loading {
            text-align: center;
            padding: 4em 2em;
        }
        
        /* Simple dark mode for code */
        body.dark-mode pre {
            background: #2d2d30;
            color: #d4d4d4;
        }
        
        body.dark-mode code {
            background: #2d2d30;
            color: #d4d4d4;
        }
        
        /* Override Prism colors for dark mode */
        body.dark-mode .token.comment,
        body.dark-mode .token.prolog,
        body.dark-mode .token.doctype,
        body.dark-mode .token.cdata {
            color: #608b4e;
        }
        
        body.dark-mode .token.punctuation {
            color: #d4d4d4;
        }
        
        body.dark-mode .token.property,
        body.dark-mode .token.tag,
        body.dark-mode .token.boolean,
        body.dark-mode .token.number,
        body.dark-mode .token.constant,
        body.dark-mode .token.symbol,
        body.dark-mode .token.deleted {
            color: #b5cea8;
        }
        
        body.dark-mode .token.selector,
        body.dark-mode .token.attr-name,
        body.dark-mode .token.string,
        body.dark-mode .token.char,
        body.dark-mode .token.builtin,
        body.dark-mode .token.inserted {
            color: #ce9178;
        }
        
        body.dark-mode .token.operator,
        body.dark-mode .token.entity,
        body.dark-mode .token.url,
        body.dark-mode .language-css .token.string,
        body.dark-mode .style .token.string {
            color: #d4d4d4;
        }
        
        body.dark-mode .token.atrule,
        body.dark-mode .token.attr-value,
        body.dark-mode .token.keyword {
            color: #c586c0;
        }
        
        body.dark-mode .token.function,
        body.dark-mode .token.class-name {
            color: #dcdcaa;
        }
        
        body.dark-mode .token.regex,
        body.dark-mode .token.important,
        body.dark-mode .token.variable {
            color: #d16969;
        }
    </style>
</head>
<body>
    <!-- Components will add mode toggle and back to top -->
    
    <div class="latex-document">
        <!-- Header placeholder -->
        <div id="header"></div>

        <div class="code-container">
            <div class="code-header">
                <h2 id="filename">Loading...</h2>
                <div class="code-actions">
                    <button class="code-button" onclick="copyCode()">Copy Code</button>
                    <button class="code-button" onclick="downloadFile()">Download</button>
                    <button class="code-button" onclick="viewRaw()">View Raw</button>
                </div>
            </div>
            <div id="code-content">
                <div class="loading">Loading code...</div>
            </div>
        </div>
        
        <!-- Footer placeholder -->
        <div id="footer"></div>
    </div>

    <!-- Prism.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    
    <script>
        // Store the file URL globally - declare it first
        let currentFileUrl = null;
        
        // Get file from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file');
        
        if (file) {
            // Store the file URL
            currentFileUrl = file;
            
            // Update filename
            document.getElementById('filename').textContent = file.split('/').pop();
            
            // Fetch and display the file
            fetch(file)
                .then(response => {
                    if (!response.ok) throw new Error('File not found');
                    return response.text();
                })
                .then(content => {
                    const codeContent = document.getElementById('code-content');
                    const extension = file.split('.').pop();
                    const language = extension === 'py' ? 'python' : 
                                   extension === 'js' ? 'javascript' : 
                                   extension === 'json' ? 'json' : 
                                   'plaintext';
                    
                    codeContent.innerHTML = `<pre><code class="language-${language}">${escapeHtml(content)}</code></pre>`;
                    
                    // Re-run Prism highlighting
                    Prism.highlightAll();
                })
                .catch(error => {
                    document.getElementById('code-content').innerHTML = 
                        '<div class="error-message">Error loading file: ' + error.message + '</div>';
                });
        } else {
            document.getElementById('code-content').innerHTML = 
                '<div class="error-message">No file specified</div>';
        }
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        function copyCode() {
            const codeElement = document.querySelector('pre code') || document.querySelector('pre');
            if (codeElement) {
                const textContent = codeElement.textContent || codeElement.innerText;
                navigator.clipboard.writeText(textContent)
                    .then(() => {
                        // Find the button that was clicked
                        const buttons = document.querySelectorAll('.code-actions button');
                        const button = buttons[0]; // Copy button is first
                        const originalText = button.textContent;
                        button.textContent = 'Copied!';
                        setTimeout(() => {
                            button.textContent = originalText;
                        }, 2000);
                    })
                    .catch(err => {
                        console.error('Failed to copy:', err);
                        // Fallback for older browsers
                        const textArea = document.createElement('textarea');
                        textArea.value = textContent;
                        textArea.style.position = 'fixed';
                        textArea.style.left = '-999999px';
                        document.body.appendChild(textArea);
                        textArea.select();
                        try {
                            document.execCommand('copy');
                            const buttons = document.querySelectorAll('.code-actions button');
                            const button = buttons[0];
                            button.textContent = 'Copied!';
                            setTimeout(() => {
                                button.textContent = 'Copy Code';
                            }, 2000);
                        } catch (err) {
                            console.error('Fallback copy failed:', err);
                        }
                        document.body.removeChild(textArea);
                    });
            }
        }
        
        function downloadFile() {
            if (currentFileUrl) {
                const filename = currentFileUrl.split('/').pop();
                const a = document.createElement('a');
                a.href = currentFileUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }
        
        function viewRaw() {
            if (currentFileUrl) {
                // Fetch the content and display as plain text in a new window
                fetch(currentFileUrl)
                    .then(response => {
                        if (!response.ok) throw new Error('File not found');
                        return response.text();
                    })
                    .then(content => {
                        // Create a new window with the raw content
                        const newWindow = window.open('', '_blank');
                        newWindow.document.write('<html><head><title>' + currentFileUrl.split('/').pop() + '</title></head><body>');
                        newWindow.document.write('<pre style="font-family: monospace; white-space: pre-wrap; word-wrap: break-word;">');
                        newWindow.document.write(escapeHtml(content));
                        newWindow.document.write('</pre></body></html>');
                        newWindow.document.close();
                    })
                    .catch(error => {
                        alert('Error loading file: ' + error.message);
                    });
            }
        }
        
    </script>
    
    <!-- Main script -->
    <script src="js/main.js"></script>
    <script>
        // Initialize components
        Components.init({
            title: 'Code Viewer',
            version: '1.0'
        });
    </script>
</body>
</html>
