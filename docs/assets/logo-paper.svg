<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
  <!-- Paper background with realistic shadow -->
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main paper sheet -->
  <rect x="20" y="20" width="160" height="220" rx="1" ry="1" 
        fill="#fdfcf8" stroke="none" filter="url(#shadow)"/>
  
  <!-- Subtle paper texture lines -->
  <line x1="20" y1="60" x2="180" y2="60" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="20" y1="90" x2="180" y2="90" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="20" y1="120" x2="180" y2="120" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="20" y1="150" x2="180" y2="150" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="20" y1="180" x2="180" y2="180" stroke="#f0f0f0" stroke-width="0.5"/>
  <line x1="20" y1="210" x2="180" y2="210" stroke="#f0f0f0" stroke-width="0.5"/>
  
  <!-- Left margin line -->
  <line x1="50" y1="20" x2="50" y2="240" stroke="#ffcccc" stroke-width="1" opacity="0.5"/>
  
  <!-- Title -->
  <text x="100" y="45" font-family="Georgia, serif" font-size="16" font-weight="bold" 
        text-anchor="middle" fill="#333333">Autophage</text>
  
  <!-- Subtitle -->
  <text x="100" y="65" font-family="Georgia, serif" font-size="10" font-style="italic"
        text-anchor="middle" fill="#666666">Protocol Documentation</text>
  
  <!-- Content lines suggesting text -->
  <rect x="55" y="85" width="100" height="2" fill="#cccccc" opacity="0.6"/>
  <rect x="55" y="95" width="90" height="2" fill="#cccccc" opacity="0.6"/>
  <rect x="55" y="105" width="110" height="2" fill="#cccccc" opacity="0.6"/>
  
  <rect x="55" y="125" width="95" height="2" fill="#cccccc" opacity="0.6"/>
  <rect x="55" y="135" width="105" height="2" fill="#cccccc" opacity="0.6"/>
  <rect x="55" y="145" width="85" height="2" fill="#cccccc" opacity="0.6"/>
  
  <!-- Small formula -->
  <text x="55" y="170" font-family="Times, serif" font-size="11" fill="#555555" font-style="italic">V(t) = V₀e^(-λt)</text>
  
  <!-- More text lines -->
  <rect x="55" y="185" width="100" height="2" fill="#cccccc" opacity="0.6"/>
  <rect x="55" y="195" width="80" height="2" fill="#cccccc" opacity="0.6"/>
</svg>