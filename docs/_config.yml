# GitHub Pages configuration for clean URLs
plugins:
  - jekyll-redirect-from

# Remove .html extensions from URLs
permalink: pretty

# Exclude files from processing
exclude:
  - README.md
  - LICENSE
  - serve
  - serve.py
  - test-local.sh

# Include dotfiles and Python files
include:
  - .htaccess
  - "*.py"

# Don't process Python files with Jekyll
keep_files:
  - "gini-simulation.py"