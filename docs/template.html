<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Title — Autophage Protocol</title>
    <meta name="description" content="Page description">
    
    <!-- Prevent dark mode flash -->
    <script>
        // Immediately determine and apply theme to prevent flash
        (function() {
            // Check saved theme first
            const savedTheme = localStorage.getItem('theme');
            const savedThemeTime = localStorage.getItem('themeSetTime');
            
            let shouldBeDark = false;
            
            // If theme was manually set in the last 24 hours, respect it
            if (savedTheme && savedThemeTime) {
                const hoursSinceSet = (Date.now() - parseInt(savedThemeTime)) / (1000 * 60 * 60);
                if (hoursSinceSet < 24) {
                    shouldBeDark = savedTheme === 'dark';
                } else {
                    // Check time and system preference
                    const hour = new Date().getHours();
                    shouldBeDark = (hour >= 19 || hour < 6) || 
                                  (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                }
            } else {
                // No saved preference, check time and system
                const hour = new Date().getHours();
                shouldBeDark = (hour >= 19 || hour < 6) || 
                              (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            }
            
            if (shouldBeDark) {
                document.documentElement.classList.add('dark-mode-init');
            }
        })();
    </script>
    
    <!-- Preload critical resources -->
    <link rel="preload" href="css/main.css" as="style">
    <link rel="preload" href="js/config.js" as="script">
    <link rel="preload" href="js/components.js" as="script">
    
    <!-- Favicons -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="alternate icon" href="favicon.ico">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    
    <!-- Configuration and Components -->
    <script src="js/config.js"></script>
    <script src="js/components.js"></script>

<body>
    <!-- Mode toggle -->
    <button class="mode-toggle" onclick="toggleMode()">D</button>
    
    <!-- Back to top -->
    <button class="back-to-top" onclick="scrollToTop()" aria-label="Back to top">↑</button>

    <div class="latex-document">
        <!-- Header placeholder -->
        <div id="header"></div>

        <!-- Content goes here -->
        
        <!-- Footer placeholder -->
        <div id="footer"></div>
    </div>

    <!-- Core functionality -->
    <script>
        // Initialize dark mode from class
        if (document.documentElement.classList.contains('dark-mode-init')) {
            document.body.classList.add('dark-mode');
            document.documentElement.classList.remove('dark-mode-init');
            document.querySelector('.mode-toggle').textContent = 'L';
        }
        
        // Initialize components
        Components.init({
            title: 'Page Title',
            version: '1.0'
        });

        // Dark mode toggle
        function toggleMode() {
            document.body.classList.toggle('dark-mode');
            const button = document.querySelector('.mode-toggle');
            const isDark = document.body.classList.contains('dark-mode');
            button.textContent = isDark ? 'L' : 'D';
            ThemeManager.saveTheme(isDark ? 'dark' : 'light');
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            const button = document.querySelector('.mode-toggle');
            const backToTop = document.querySelector('.back-to-top');
            
            if (e.key === 'l' || e.key === 'L') {
                document.body.classList.remove('dark-mode');
                button.textContent = 'D';
                localStorage.setItem('theme', 'light');
            } else if (e.key === 'd' || e.key === 'D') {
                document.body.classList.add('dark-mode');
                button.textContent = 'L';
                localStorage.setItem('theme', 'dark');
            } else if ((e.key === 's' || e.key === 'S') && backToTop.classList.contains('visible')) {
                scrollToTop();
            }
        });
        
        // Back to top functionality
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // Show/hide back to top button
        window.addEventListener('scroll', () => {
            const backToTop = document.querySelector('.back-to-top');
            if (window.scrollY > 200) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        }, { passive: true });
    </script>
</body>
</html>
