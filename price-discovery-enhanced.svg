<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="healthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C851;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#28a745;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="marketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0056D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007BFF;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="catalystGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B59B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E44AD;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="supplyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#2C3E50">
    Metabolic Price Discovery Model
  </text>
  
  <!-- Main formula display -->
  <g transform="translate(600, 150)">
    <rect x="-300" y="-40" width="600" height="80" rx="10" fill="white" stroke="#e1e4e8" stroke-width="2" filter="url(#shadow)"/>
    <text font-family="Courier New, monospace" font-size="20" text-anchor="middle" fill="#2C3E50">
      <tspan x="0" dy="10">P(t) = [E_health(t) × (1 + γC_ratio) + V_market(t) × (1 - C_ratio)]</tspan>
      <tspan x="0" dy="25">÷ [S_active(t) × V × (1 + M_activity)]</tspan>
    </text>
  </g>
  
  <!-- Numerator section -->
  <g transform="translate(600, 300)">
    <text font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      Numerator: Value Drivers
    </text>
    
    <!-- Health Energy component -->
    <g transform="translate(-350, 50)">
      <rect x="-100" y="-30" width="200" height="120" rx="10" fill="url(#healthGradient)" filter="url(#shadow)">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text y="-5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        Health Energy
      </text>
      <text y="15" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
        E_health(t)
      </text>
      <text y="35" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#E8FFE8">
        Verified activity cost
      </text>
      <text y="55" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
        10,000 units
      </text>
    </g>
    
    <!-- Catalyst Ratio component -->
    <g transform="translate(0, 50)">
      <rect x="-100" y="-30" width="200" height="120" rx="10" fill="url(#catalystGradient)" filter="url(#shadow)">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="2.5s" repeatCount="indefinite"/>
      </rect>
      <text y="-5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        Catalyst Ratio
      </text>
      <text y="15" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
        C_ratio × γ
      </text>
      <text y="35" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#FFE6F7">
        Protocol activity
      </text>
      <text y="55" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
        0.3 × 2.0 = 0.6
      </text>
    </g>
    
    <!-- Market Volume component -->
    <g transform="translate(350, 50)">
      <rect x="-100" y="-30" width="200" height="120" rx="10" fill="url(#marketGradient)" filter="url(#shadow)">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <text y="-5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        Market Volume
      </text>
      <text y="15" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
        V_market(t)
      </text>
      <text y="35" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#E6F3FF">
        Trading activity
      </text>
      <text y="55" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
        5,000 units
      </text>
    </g>
  </g>
  
  <!-- Division line -->
  <line x1="200" y1="480" x2="1000" y2="480" stroke="#2C3E50" stroke-width="3" stroke-dasharray="10,5">
    <animate attributeName="stroke-dashoffset" from="0" to="-15" dur="1s" repeatCount="indefinite"/>
  </line>
  
  <!-- Denominator section -->
  <g transform="translate(600, 550)">
    <text font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2C3E50">
      Denominator: Supply Factors
    </text>
    
    <!-- Active Supply -->
    <g transform="translate(-350, 50)">
      <rect x="-100" y="-30" width="200" height="100" rx="10" fill="url(#supplyGradient)" filter="url(#shadow)">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <text y="-5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        Active Supply
      </text>
      <text y="15" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
        S_active(t)
      </text>
      <text y="40" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
        100,000 tokens
      </text>
    </g>
    
    <!-- Velocity -->
    <g transform="translate(0, 50)">
      <rect x="-100" y="-30" width="200" height="100" rx="10" fill="#f39c12" filter="url(#shadow)">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="2.7s" repeatCount="indefinite"/>
      </rect>
      <text y="-5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        Velocity
      </text>
      <text y="15" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
        V
      </text>
      <text y="40" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
        2.0x monthly
      </text>
    </g>
    
    <!-- Activity Multiplier -->
    <g transform="translate(350, 50)">
      <rect x="-100" y="-30" width="200" height="100" rx="10" fill="#16a085" filter="url(#shadow)">
        <animate attributeName="opacity" values="0.9;1;0.9" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <text y="-5" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
        Activity Multi
      </text>
      <text y="15" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
        M_activity
      </text>
      <text y="40" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
        1.5
      </text>
    </g>
  </g>
  
  <!-- Result box -->
  <g transform="translate(600, 720)">
    <rect x="-120" y="-30" width="240" height="60" rx="30" fill="#e74c3c" filter="url(#shadow)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
      Final Price: $0.078
    </text>
    <text y="20" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#FFE6E6">
      per token at equilibrium
    </text>
  </g>
  
  <!-- Calculation flow arrows -->
  <g stroke="#7f8c8d" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 250 420 Q 300 450 350 480" marker-end="url(#arrowhead)"/>
    <path d="M 600 420 Q 600 450 600 480" marker-end="url(#arrowhead)"/>
    <path d="M 950 420 Q 900 450 850 480" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7f8c8d"/>
    </marker>
  </defs>
</svg>