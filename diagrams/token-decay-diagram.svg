<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rhythmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#FFFFFF"/>
  
  <!-- Grid -->
  <g stroke="#E0E0E0" stroke-width="1">
    <!-- Vertical grid lines (every 10 days) -->
    <line x1="100" y1="80" x2="100" y2="380" />
    <line x1="180" y1="80" x2="180" y2="380" />
    <line x1="260" y1="80" x2="260" y2="380" />
    <line x1="340" y1="80" x2="340" y2="380" />
    <line x1="420" y1="80" x2="420" y2="380" />
    <line x1="500" y1="80" x2="500" y2="380" />
    <line x1="580" y1="80" x2="580" y2="380" />
    <line x1="660" y1="80" x2="660" y2="380" />
    
    <!-- Horizontal grid lines (every 200 tokens) -->
    <line x1="100" y1="140" x2="660" y2="140" />
    <line x1="100" y1="200" x2="660" y2="200" />
    <line x1="100" y1="260" x2="660" y2="260" />
    <line x1="100" y1="320" x2="660" y2="320" />
  </g>
  
  <!-- Axes -->
  <g stroke="#333333" stroke-width="2">
    <line x1="100" y1="380" x2="660" y2="380" />
    <line x1="100" y1="380" x2="100" y2="80" />
  </g>
  
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold">
    Token Balance Decay Over Time
  </text>
  <text x="400" y="55" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="14">
    Example: Rhythm Tokens with 5% Daily Decay Rate
  </text>
  
  <!-- Y-axis labels -->
  <g fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="12">
    <text x="85" y="85" text-anchor="end">1000</text>
    <text x="85" y="145" text-anchor="end">800</text>
    <text x="85" y="205" text-anchor="end">600</text>
    <text x="85" y="265" text-anchor="end">400</text>
    <text x="85" y="325" text-anchor="end">200</text>
    <text x="85" y="385" text-anchor="end">0</text>
  </g>
  
  <!-- X-axis labels -->
  <g fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="12">
    <text x="100" y="405" text-anchor="middle">0</text>
    <text x="180" y="405" text-anchor="middle">10</text>
    <text x="260" y="405" text-anchor="middle">20</text>
    <text x="340" y="405" text-anchor="middle">30</text>
    <text x="420" y="405" text-anchor="middle">40</text>
    <text x="500" y="405" text-anchor="middle">50</text>
    <text x="580" y="405" text-anchor="middle">60</text>
    <text x="660" y="405" text-anchor="middle">70</text>
  </g>
  
  <!-- Axis labels -->
  <text x="380" y="445" text-anchor="middle" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">Time (days)</text>
  <text x="30" y="230" text-anchor="middle" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" transform="rotate(-90 30 230)">Token Balance</text>
  
  <!-- Exponential decay curve path -->
  <!-- Using the formula: V(t) = 1000 * (0.95)^t for 5% daily decay -->
  <path d="M 100,80 
           C 140,105 180,134 220,169
           C 260,209 300,256 340,310
           C 380,350 420,380 460,380
           L 500,380 L 580,380 L 660,380" 
        stroke="url(#rhythmGradient)" stroke-width="3" fill="none" filter="url(#shadow)"/>
  
  <!-- Shaded area under curve -->
  <path d="M 100,380 L 100,80 
           C 140,105 180,134 220,169
           C 260,209 300,256 340,310
           C 380,350 420,380 460,380
           L 660,380 Z" 
        fill="url(#rhythmGradient)" opacity="0.1"/>
  
  <!-- Half-life marker -->
  <g>
    <line x1="208" y1="80" x2="208" y2="160" stroke="#FF6B35" stroke-width="2" stroke-dasharray="5,5"/>
    <circle cx="208" cy="160" r="4" fill="#FF6B35"/>
    <rect x="218" y="145" width="140" height="30" fill="#FFFFFF" stroke="#FF6B35" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="288" y="165" text-anchor="middle" fill="#FF6B35" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold">
      t½ = 13.51 days
    </text>
  </g>
  
  <!-- Initial balance indicator -->
  <g>
    <circle cx="100" cy="80" r="5" fill="#FF6B35"/>
    <rect x="110" y="65" width="120" height="30" fill="#FFFFFF" stroke="#FF6B35" stroke-width="1.5" rx="5" filter="url(#shadow)"/>
    <text x="170" y="85" text-anchor="middle" fill="#FF6B35" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold">
      V₀ = 1000 tokens
    </text>
  </g>
  
  <!-- Decay formula -->
  <g>
    <rect x="480" y="280" width="170" height="80" fill="#FFFFFF" stroke="#333333" stroke-width="1.5" rx="10" filter="url(#shadow)"/>
    <text x="565" y="305" text-anchor="middle" fill="#333333" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold">
      Decay Model
    </text>
    <text x="565" y="330" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="12" font-style="italic">
      V(t) = V₀ × (1 - δ)^t
    </text>
    <text x="565" y="350" text-anchor="middle" fill="#666666" font-family="Helvetica, Arial, sans-serif" font-size="11">
      δ = 0.05 (5% daily)
    </text>
  </g>
</svg>