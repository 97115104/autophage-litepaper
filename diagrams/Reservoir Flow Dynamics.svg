<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- White background -->
  <rect width="800" height="500" fill="white"/>
  
  <!-- Define arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
    
    <!-- Gradient for token decay visualization -->
    <linearGradient id="tokenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Times, serif" font-size="18" fill="#000" text-anchor="middle">System Flow Dynamics</text>
  
  <!-- User Pool -->
  <g transform="translate(80, 120)">
    <rect x="0" y="0" width="140" height="200" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="70" y="-10" font-family="Times, serif" font-size="14" fill="#000" text-anchor="middle">User Pool</text>
    
    <!-- Token representation with gradient -->
    <rect x="20" y="30" width="100" height="150" fill="url(#tokenGradient)"/>
    
    <!-- Mathematical notation -->
    <text x="70" y="195" font-family="Times, serif" font-size="11" fill="#000" text-anchor="middle" font-style="italic">V(t)</text>
  </g>
  
  <!-- Reservoir -->
  <g transform="translate(340, 120)">
    <!-- Token Chamber -->
    <rect x="0" y="0" width="140" height="90" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="70" y="-10" font-family="Times, serif" font-size="14" fill="#000" text-anchor="middle">Reservoir</text>
    <text x="70" y="20" font-family="Times, serif" font-size="12" fill="#000" text-anchor="middle">Token Chamber</text>
    
    <!-- Token level indicator -->
    <rect x="20" y="40" width="100" height="35" fill="#000" opacity="0.2"/>
    <text x="70" y="85" font-family="Times, serif" font-size="11" fill="#000" text-anchor="middle" font-style="italic">R_T(t)</text>
    
    <!-- USDC Chamber -->
    <rect x="0" y="110" width="140" height="90" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="70" y="130" font-family="Times, serif" font-size="12" fill="#000" text-anchor="middle">USDC Chamber</text>
    
    <!-- USDC level indicator -->
    <rect x="20" y="150" width="100" height="35" fill="#000" opacity="0.3"/>
    <text x="70" y="195" font-family="Times, serif" font-size="11" fill="#000" text-anchor="middle" font-style="italic">R_U(t)</text>
  </g>
  
  <!-- Healthcare Settlement -->
  <g transform="translate(580, 120)">
    <rect x="0" y="0" width="140" height="200" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="70" y="-10" font-family="Times, serif" font-size="14" fill="#000" text-anchor="middle">Healthcare</text>
    <text x="70" y="100" font-family="Times, serif" font-size="12" fill="#000" text-anchor="middle">Settlement</text>
    <text x="70" y="195" font-family="Times, serif" font-size="11" fill="#000" text-anchor="middle" font-style="italic">H_settle(t)</text>
  </g>
  
  <!-- Flow arrows with labels -->
  <!-- Decay flow -->
  <g>
    <path d="M 220 170 L 330 170" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="275" y="165" font-family="Times, serif" font-size="11" fill="#000" text-anchor="middle" font-style="italic">δ · V(t)</text>
    <text x="275" y="185" font-family="Times, serif" font-size="10" fill="#000" text-anchor="middle">decay</text>
  </g>
  
  <!-- Fee flow -->
  <g>
    <path d="M 220 270 Q 275 290 330 270" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="275" y="300" font-family="Times, serif" font-size="11" fill="#000" text-anchor="middle" font-style="italic">F_market(t)</text>
    <text x="275" y="315" font-family="Times, serif" font-size="10" fill="#000" text-anchor="middle">fees</text>
  </g>
  
  <!-- Healthcare payment -->
  <g>
    <path d="M 490 220 L 570 220" stroke="#000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="530" y="215" font-family="Times, serif" font-size="11" fill="#000" text-anchor="middle" font-style="italic">H_settle(t)</text>
    <text x="530" y="235" font-family="Times, serif" font-size="10" fill="#000" text-anchor="middle">claims</text>
  </g>
  
  <!-- Equilibrium condition -->
  <g transform="translate(100, 380)">
    <rect x="0" y="0" width="600" height="80" fill="none" stroke="#000" stroke-width="0.5"/>
    <text x="300" y="20" font-family="Times, serif" font-size="12" fill="#000" text-anchor="middle" font-weight="bold">Equilibrium Conditions</text>
    <text x="300" y="40" font-family="Times, serif" font-size="11" fill="#000" text-anchor="middle" font-style="italic">R_T(t+1) = R_T(t) + R_in(t) - W_hc(t) - S(t)</text>
    <text x="300" y="55" font-family="Times, serif" font-size="11" fill="#000" text-anchor="middle" font-style="italic">R_U(t+1) = R_U(t) + F_market(t) - H_settle(t)</text>
    <text x="300" y="70" font-family="Times, serif" font-size="11" fill="#000" text-anchor="middle" font-style="italic">R_U(t) ≥ max(0.4D, 3O, 0.22Y)</text>
  </g>
</svg>