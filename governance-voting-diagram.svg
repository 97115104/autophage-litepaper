<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="govGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="powerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#2ECC71;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="600" fill="#0a0a0a"/>
  
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    Contribution-Based Governance Model
  </text>
  
  <!-- Contribution Score Formula -->
  <g transform="translate(450, 90)">
    <rect x="-300" y="-25" width="600" height="50" fill="#1a1a1a" stroke="#666" stroke-width="2" rx="10"/>
    <text x="0" y="5" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="14" font-style="italic">
      C = 0.5 × log₁₀(1 + R_lifetime) + 0.3 × V_rep + 0.2 × A_part
    </text>
  </g>
  
  <!-- Three Components -->
  <g id="components">
    <!-- Lifetime Contribution -->
    <g transform="translate(150, 200)">
      <rect x="-80" y="-40" width="160" height="120" fill="#1a1a1a" stroke="#F39C12" stroke-width="2" rx="10"/>
      <text x="0" y="-20" text-anchor="middle" fill="#F39C12" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
        Lifetime Tokens
      </text>
      <text x="0" y="0" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="12">
        50% weight
      </text>
      
      <rect x="-60" y="10" width="120" height="50" fill="#222" rx="5"/>
      <text x="0" y="30" text-anchor="middle" fill="#F39C12" font-family="Arial, sans-serif" font-size="10">
        Decayed tokens
      </text>
      <text x="0" y="45" text-anchor="middle" fill="#F39C12" font-family="Arial, sans-serif" font-size="10">
        Donated tokens
      </text>
    </g>
    
    <!-- Verification Reputation -->
    <g transform="translate(450, 200)">
      <rect x="-80" y="-40" width="160" height="120" fill="#1a1a1a" stroke="#9B59B6" stroke-width="2" rx="10"/>
      <text x="0" y="-20" text-anchor="middle" fill="#9B59B6" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
        Verification Rep
      </text>
      <text x="0" y="0" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="12">
        30% weight
      </text>
      
      <rect x="-60" y="10" width="120" height="50" fill="#222" rx="5"/>
      <text x="0" y="30" text-anchor="middle" fill="#9B59B6" font-family="Arial, sans-serif" font-size="10">
        Proof quality
      </text>
      <text x="0" y="45" text-anchor="middle" fill="#9B59B6" font-family="Arial, sans-serif" font-size="10">
        Success rate
      </text>
    </g>
    
    <!-- Active Participation -->
    <g transform="translate(750, 200)">
      <rect x="-80" y="-40" width="160" height="120" fill="#1a1a1a" stroke="#2ECC71" stroke-width="2" rx="10"/>
      <text x="0" y="-20" text-anchor="middle" fill="#2ECC71" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
        90-Day Activity
      </text>
      <text x="0" y="0" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="12">
        20% weight
      </text>
      
      <rect x="-60" y="10" width="120" height="50" fill="#222" rx="5"/>
      <text x="0" y="30" text-anchor="middle" fill="#2ECC71" font-family="Arial, sans-serif" font-size="10">
        Recent activity
      </text>
      <text x="0" y="45" text-anchor="middle" fill="#2ECC71" font-family="Arial, sans-serif" font-size="10">
        Participation %
      </text>
    </g>
  </g>
  
  <!-- Arrows pointing down -->
  <g stroke="#666" stroke-width="2" fill="none">
    <path d="M 150,280 L 150,320 L 450,360" marker-end="url(#arrowDown)"/>
    <path d="M 450,280 L 450,360" marker-end="url(#arrowDown)"/>
    <path d="M 750,280 L 750,320 L 450,360" marker-end="url(#arrowDown)"/>
  </g>
  
  <!-- Voting Power Calculation -->
  <g transform="translate(450, 380)">
    <rect x="-150" y="-20" width="300" height="60" fill="#1a1a1a" stroke="url(#govGradient)" stroke-width="2" rx="10"/>
    <text x="0" y="0" text-anchor="middle" fill="#E74C3C" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      Voting Power = √C × Multipliers
    </text>
    <text x="0" y="20" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="12">
      Quadratic scaling prevents dominance
    </text>
  </g>
  
  <!-- Example Calculation -->
  <g transform="translate(150, 480)">
    <rect x="-100" y="-30" width="200" height="100" fill="#1a1a1a" stroke="#333" stroke-width="1" rx="10"/>
    <text x="0" y="-10" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold">
      Example: Sarah
    </text>
    <text x="0" y="10" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10">
      R_lifetime: 50,000 tokens
    </text>
    <text x="0" y="25" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10">
      V_rep: 0.85 (85%)
    </text>
    <text x="0" y="40" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10">
      A_part: 0.90 (90%)
    </text>
    <text x="0" y="60" text-anchor="middle" fill="#2ECC71" font-family="Arial, sans-serif" font-size="12" font-weight="bold">
      C = 2.85, Power = 1.69
    </text>
  </g>
  
  <!-- Empirical Testing Process -->
  <g transform="translate(600, 460)">
    <rect x="-150" y="-40" width="300" height="120" fill="#1a1a1a" stroke="#3498DB" stroke-width="2" rx="10"/>
    <text x="0" y="-20" text-anchor="middle" fill="#3498DB" font-family="Arial, sans-serif" font-size="16" font-weight="bold">
      Empirical Testing Required
    </text>
    
    <g transform="translate(-120, 0)">
      <rect x="-10" y="-10" width="100" height="60" fill="#222" rx="5"/>
      <text x="40" y="5" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="10">
        1. Stake tokens
      </text>
      <text x="40" y="20" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="10">
        2. A/B test
      </text>
      <text x="40" y="35" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="10">
        3. p &lt; 0.05
      </text>
    </g>
    
    <g transform="translate(30, 0)">
      <rect x="-10" y="-10" width="100" height="60" fill="#222" rx="5"/>
      <text x="40" y="5" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="10">
        Power ≥ 0.8
      </text>
      <text x="40" y="20" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="10">
        n = sample
      </text>
      <text x="40" y="35" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="10">
        ε threshold
      </text>
    </g>
  </g>
  
  <!-- Visual representation of voting power distribution -->
  <g transform="translate(450, 320)">
    <rect x="-200" y="-160" width="400" height="120" fill="url(#powerGradient)" opacity="0.3" rx="10"/>
    <text x="0" y="-120" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="12" opacity="0.7">
      Voting Power Distribution
    </text>
    
    <!-- Bar chart representation -->
    <g transform="translate(-150, -100)">
      <rect x="0" y="60" width="30" height="40" fill="#3498DB" opacity="0.6"/>
      <rect x="40" y="40" width="30" height="60" fill="#3498DB" opacity="0.7"/>
      <rect x="80" y="20" width="30" height="80" fill="#3498DB" opacity="0.8"/>
      <rect x="120" y="30" width="30" height="70" fill="#2ECC71" opacity="0.8"/>
      <rect x="160" y="50" width="30" height="50" fill="#2ECC71" opacity="0.7"/>
      <rect x="200" y="70" width="30" height="30" fill="#2ECC71" opacity="0.6"/>
      <rect x="240" y="85" width="30" height="15" fill="#2ECC71" opacity="0.5"/>
    </g>
  </g>
  
  <defs>
    <marker id="arrowDown" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L5,10 L10,0" fill="#666" />
    </marker>
  </defs>
</svg>