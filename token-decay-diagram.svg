<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rhythmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F7931E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#0a0a0a"/>
  
  <!-- Grid -->
  <g stroke="#1a1a1a" stroke-width="1">
    <!-- Vertical grid lines -->
    <line x1="100" y1="50" x2="100" y2="350" />
    <line x1="200" y1="50" x2="200" y2="350" />
    <line x1="300" y1="50" x2="300" y2="350" />
    <line x1="400" y1="50" x2="400" y2="350" />
    <line x1="500" y1="50" x2="500" y2="350" />
    <line x1="600" y1="50" x2="600" y2="350" />
    <line x1="700" y1="50" x2="700" y2="350" />
    
    <!-- Horizontal grid lines -->
    <line x1="100" y1="100" x2="700" y2="100" />
    <line x1="100" y1="150" x2="700" y2="150" />
    <line x1="100" y1="200" x2="700" y2="200" />
    <line x1="100" y1="250" x2="700" y2="250" />
    <line x1="100" y1="300" x2="700" y2="300" />
  </g>
  
  <!-- Axes -->
  <g stroke="#666" stroke-width="2">
    <line x1="100" y1="350" x2="700" y2="350" />
    <line x1="100" y1="350" x2="100" y2="50" />
  </g>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" fill="#FFF" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    Token Balance Over Time (Example: Rhythm Tokens)
  </text>
  
  <!-- Y-axis labels -->
  <g fill="#999" font-family="Arial, sans-serif" font-size="14">
    <text x="80" y="55" text-anchor="end">1000</text>
    <text x="80" y="105" text-anchor="end">800</text>
    <text x="80" y="155" text-anchor="end">600</text>
    <text x="80" y="205" text-anchor="end">400</text>
    <text x="80" y="255" text-anchor="end">200</text>
    <text x="80" y="355" text-anchor="end">0</text>
  </g>
  
  <!-- X-axis labels -->
  <g fill="#999" font-family="Arial, sans-serif" font-size="14">
    <text x="100" y="375" text-anchor="middle">0</text>
    <text x="200" y="375" text-anchor="middle">10</text>
    <text x="300" y="375" text-anchor="middle">20</text>
    <text x="400" y="375" text-anchor="middle">30</text>
    <text x="500" y="375" text-anchor="middle">40</text>
    <text x="600" y="375" text-anchor="middle">50</text>
    <text x="700" y="375" text-anchor="middle">60</text>
  </g>
  
  <!-- Axis labels -->
  <text x="400" y="395" text-anchor="middle" fill="#CCC" font-family="Arial, sans-serif" font-size="16">Days</text>
  <text x="30" y="200" text-anchor="middle" fill="#CCC" font-family="Arial, sans-serif" font-size="16" transform="rotate(-90 30 200)">Token Balance</text>
  
  <!-- Exponential decay curve -->
  <path d="M 100 50 Q 150 65, 200 100 T 300 150 Q 350 175, 400 200 T 500 240 Q 550 260, 600 280 T 700 310" 
        stroke="url(#rhythmGradient)" stroke-width="3" fill="none" filter="url(#glow)"/>
  
  <!-- Half-life marker -->
  <g>
    <line x1="235" y1="50" x2="235" y2="125" stroke="#FF6B35" stroke-width="2" stroke-dasharray="5,5" opacity="0.7"/>
    <circle cx="235" cy="125" r="4" fill="#FF6B35"/>
    <rect x="240" y="110" width="120" height="30" fill="#1a1a1a" stroke="#FF6B35" stroke-width="1" rx="5"/>
    <text x="300" y="130" text-anchor="middle" fill="#FF6B35" font-family="Arial, sans-serif" font-size="12">
      Half-life: 13.51 days
    </text>
  </g>
  
  <!-- Initial balance indicator -->
  <g>
    <circle cx="100" cy="50" r="5" fill="#FF6B35"/>
    <rect x="110" y="40" width="100" height="20" fill="#1a1a1a" stroke="#FF6B35" stroke-width="1" rx="5"/>
    <text x="160" y="54" text-anchor="middle" fill="#FF6B35" font-family="Arial, sans-serif" font-size="12">
      Initial balance
    </text>
  </g>
  
  <!-- Decay rate info -->
  <g>
    <rect x="550" y="320" width="130" height="20" fill="#1a1a1a" stroke="#666" stroke-width="1" rx="5"/>
    <text x="615" y="334" text-anchor="middle" fill="#999" font-family="Arial, sans-serif" font-size="12">
      Decay rate: 5% daily
    </text>
  </g>
</svg>